# Diagnostic build matrix. Does NOT deploy or commit anything.
name: Build test

on:
  workflow_dispatch:
  push:
    branches: [ci-build-test]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hugo: "0.89.4"
            repo: "wowchemy/wowchemy-hugo-themes"
            tag: "v5.0.0"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch theme ${{ matrix.repo }}@${{ matrix.tag }}
        continue-on-error: true
        run: |
          git clone --depth 1 --branch ${{ matrix.tag }} \
            https://github.com/${{ matrix.repo }}.git /tmp/theme
          mkdir -p themes/hugo-academic
          if [ -d /tmp/theme/wowchemy ]; then
            cp -r /tmp/theme/wowchemy/. themes/hugo-academic/
          else
            cp -r /tmp/theme/. themes/hugo-academic/
          fi
          echo "### theme.toml ###"
          cat themes/hugo-academic/theme.toml 2>/dev/null | head -12

      - name: Show the template that failed before
        continue-on-error: true
        run: |
          echo "### publication/single.html lines 1-25 ###"
          sed -n '1,25p' themes/hugo-academic/layouts/publication/single.html || echo "file absent"

      - name: Install Hugo ${{ matrix.hugo }} extended
        run: |
          curl -sSL -o /tmp/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${{ matrix.hugo }}/hugo_extended_${{ matrix.hugo }}_Linux-64bit.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Build
        continue-on-error: true
        run: hugo -d /tmp/out 2>&1 | tail -25

      - name: Compare built homepage against the published one
        if: always()
        run: |
          python3 - <<'EOF'
          import re, html
          def grab(path):
              t = open(path, encoding='utf-8', errors='replace').read()
              nav = re.search(r'id="navbar-content".*?</ul>', t, re.S)
              labels = []
              if nav:
                  labels = [html.unescape(x).strip() for x in
                            re.findall(r'<span>\s*(.*?)\s*</span>', nav.group(0), re.S)]
                  labels = [l for l in labels if l and '<' not in l]
              ids = re.findall(r'<section id="?([a-z0-9-]+)"?', t)
              h3 = [html.unescape(x).strip()[:70] for x in
                    re.findall(r'<h3[^>]*>\s*(.*?)\s*</h3>', t, re.S)]
              h3 = [x for x in h3 if '<' not in x]
              return labels, ids, h3
          a = grab('index.html')      # currently published
          b = grab('/tmp/out/index.html')  # freshly built
          for name, (labels, ids, h3) in (("PUBLISHED", a), ("BUILT", b)):
              print(f"--- {name} nav:", " | ".join(labels))
              print(f"--- {name} sections:", ", ".join(ids))
              print(f"--- {name} h3 count:", len(h3))
              for x in h3[:14]:
                  print(f"      {name}: {x}")
          print("=== only PUBLISHED has these headings ===")
          for x in set(a[2]) - set(b[2]): print("   LOST:", x)
          print("=== presence checks (anywhere in the page) ===")
          bt = open('/tmp/out/index.html', encoding='utf-8', errors='replace').read()
          pt = open('index.html', encoding='utf-8', errors='replace').read()
          for needle in ["Interests", "Education", "Environmental Economics",
                         "University of Maryland", "URM 2010", "Metrorail",
                         "hanxianru@cuhk.edu.cn", "Opportunities"]:
              print(f"   {needle!r:34} published={needle in pt!s:5} built={needle in bt}")
          print("=== only BUILT has these headings ===")
          for x in set(b[2]) - set(a[2]): print("   NEW :", x)
          EOF
