# Diagnostic build matrix. Does NOT deploy or commit anything.
name: Build test

on:
  workflow_dispatch:
  push:
    branches: [ci-build-test]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hugo: "0.79.1"
            repo: "gcushen/hugo-academic"
            tag: "v4.8.0"
          - hugo: "0.83.1"
            repo: "wowchemy/wowchemy-hugo-themes"
            tag: "v4.8.0"
          - hugo: "0.89.4"
            repo: "wowchemy/wowchemy-hugo-themes"
            tag: "v5.0.0"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch theme ${{ matrix.repo }}@${{ matrix.tag }}
        continue-on-error: true
        run: |
          git clone --depth 1 --branch ${{ matrix.tag }} \
            https://github.com/${{ matrix.repo }}.git /tmp/theme
          mkdir -p themes/hugo-academic
          if [ -d /tmp/theme/wowchemy ]; then
            cp -r /tmp/theme/wowchemy/. themes/hugo-academic/
          else
            cp -r /tmp/theme/. themes/hugo-academic/
          fi
          echo "### theme.toml ###"
          cat themes/hugo-academic/theme.toml 2>/dev/null | head -12

      - name: Show the template that failed before
        continue-on-error: true
        run: |
          echo "### publication/single.html lines 1-25 ###"
          sed -n '1,25p' themes/hugo-academic/layouts/publication/single.html || echo "file absent"

      - name: Install Hugo ${{ matrix.hugo }} extended
        run: |
          curl -sSL -o /tmp/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${{ matrix.hugo }}/hugo_extended_${{ matrix.hugo }}_Linux-64bit.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Build
        continue-on-error: true
        run: hugo -d /tmp/out --minify 2>&1 | tail -25

      - name: Result
        if: always()
        run: |
          N=$(find /tmp/out -type f 2>/dev/null | wc -l)
          echo "files produced: $N"
          if [ "$N" -gt 0 ]; then
            echo "BUILD PRODUCED OUTPUT"
            grep -c -i "Opportunities" /tmp/out/index.html 2>/dev/null \
              && echo "Opportunities section present" || echo "Opportunities NOT in index.html"
          else
            echo "BUILD PRODUCED NOTHING"
          fi
