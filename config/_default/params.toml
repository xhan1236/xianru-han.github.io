# SITE SETUP
# Guide: https://sourcethemes.com/academic/docs/get-started/
# Documentation: https://sourcethemes.com/academic/docs/
#
# This file is formatted using TOML syntax.
# Each configuration section is defined by a name in square brackets (e.g. [search]).

############################
## Theme
############################

# Choose a theme.
theme = "minimal"

# Enable users to switch between day and night mode?
day_night = false

# Override the theme's font set (optional).
font = ""

# Choose a font size.
# Sizes: XS, S, M, L, XL
font_size = "L"


############################
## Basic Info
############################

# Website type
site_type = "Person"

# Local business type
local_business_type = ""

# Current organization
org_name = "The Chinese University of Hong Kong, Shenzhen"

# Description for search engines and social sharing
description = "Xianru Han is an Assistant Professor in the Division of Development and Governance, School of Humanities and Social Science, at The Chinese University of Hong Kong, Shenzhen. His research focuses on environmental economics, energy economics, transportation economics, and applied microeconometrics."


############################
## Site Features
############################

# Enable source code highlighting?
highlight = true

# Additional highlighting languages
highlight_languages = ["r"]

# Enable LaTeX math rendering?
math = false

# Enable diagram rendering?
diagram = false

# Privacy pack
privacy_pack = false

# Enable visitors to edit pages?
edit_page = {
  repo_url = "https://github.com/xhan1236/xianru-han.github.io",
  content_dir = "",
  repo_branch = "main",
  editable = {
    docs = true,
    page = false,
    post = false
  }
}

# Show related content at the bottom of pages?
show_related = {
  docs = true,
  page = false,
  post = true,
  project = true,
  publication = true,
  talk = true
}


############################
## Contact details
############################

# Email
email = "hanxianru@cuhk.edu.cn"

# Phone
# Leave blank if you do not want to display a phone number.
phone = ""

# Address
# I recommend not displaying a specific office until you want to publish it.
address = {
  street = "",
  city = "Shenzhen",
  region = "Guangdong",
  postcode = "",
  country = "China",
  country_code = "CN"
}

# Geographic coordinates
# Leave commented out unless you want to show a map.
# coordinates = {latitude = "", longitude = ""}

# Directions for visitors
# directions = ""

# Office hours
# office_hours = []

# Appointment booking URL
# appointment_url = ""


# Contact links
contact_links = [
  {
    icon = "twitter",
    icon_pack = "fab",
    name = "XianruH",
    link = "https://twitter.com/XianruH"
  }
]


############################
## Social
############################

# Default image for social sharing and search engines.
sharing_image = ""

# Twitter username without @
twitter = "XianruH"


############################
## Regional Settings
############################

# Date format
date_format = "Jan 2, 2006"

# Time format
time_format = "3:04 PM"

# Address format
address_format = "en-us"


############################
## Advanced
############################

# Main menu
main_menu = {
  enable = true,
  align = "l",
  show_logo = true,
  highlight_active_link = true,
  show_language = false
}

# Show estimated reading time?
reading_time = false

# Display next/previous section pager?
section_pager = false
docs_section_pager = true

# Enable social sharing buttons?
sharing = true

# Copyright license
copyright_license = {
  enable = false,
  allow_derivatives = false,
  share_alike = true,
  allow_commercial = false,
  notice = "This work is licensed under {license}"
}

# Highlight site author in author lists?
highlight_superuser = false

# Link authors to their profile page?
link_authors = true

# Abstract length
abstract_length = 135

# Load JS plugins
plugins_js = []


############################
## Avatar
############################

[avatar]

# Get avatars from Gravatar?
gravatar = false

# Avatar shape: circle or square
shape = "circle"


############################
## Address formats
############################

[address_formats]

en-us = {
  order = ['street', 'city', 'region', 'postcode'],
  delimiters = [', ', ', ', ' ', '']
}

en-gb = {
  order = ['street', 'city', 'region', 'postcode'],
  delimiters = [', ', ', ', ', ', '']
}

de = {
  order = ['street', 'postcode', 'city'],
  delimiters = ['<br>', ' ', '']
}

fr-fr = {
  order = ['street', 'postcode', 'city'],
  delimiters = ['<br>', ' ', '']
}

zh = {
  order = ['postcode', 'region', 'city', 'street'],
  delimiters = [' ', ' ', ' ', '']
}


############################
## Publications
############################

[publications]

# Publication date format
date_format = "January 2006"

# Citation style: apa or mla
citation_style = "apa"


############################
## Projects
############################

[projects]

# Views for associated content
post_view = 2
publication_view = 2
talk_view = 2


############################
## Comments
############################

[comments]

# 0 = Disabled
# 1 = Disqus
# 2 = Commento
engine = 0

# Which page types are commentable?
commentable = {
  page = true,
  post = true,
  docs = true,
  project = true,
  publication = true,
  talk = true
}


[comments.disqus]

shortname = ""
show_count = true


[comments.commento]

url = ""


############################
## Search
############################

[search]

# 0 = No search
# 1 = Academic built-in
# 2 = Algolia
engine = 1


[search.algolia]

app_id = ""
api_key = ""
index_name = ""
show_logo = false


############################
## Maps
############################

[map]

# 0 = No map
# 1 = Google Maps
# 2 = OpenStreetMap
# 3 = Mapbox
engine = 0

api_key = ""

zoom = 15


############################
## Marketing
############################

[marketing]

google_analytics = ""
google_tag_manager = ""


############################
## Content Management System
############################

[cms]

netlify_cms = true


############################
## Icon Pack Extensions
############################

[icon.pack]

ai = true
